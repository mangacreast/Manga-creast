<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberShield Security</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00ffcc;
            --bg-color: #0a0a0f;
            --card-bg: rgba(20, 20, 30, 0.7);
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-color) 70%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            padding: 30px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 255, 204, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        /* تأثير خط الفحص (Scanner) */
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 2s infinite ease-in-out;
            display: block;
        }
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }
        .icon-container {
            text-align: center;
            font-size: 50px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        .title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .step {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #aaa;
            opacity: 0.4;
            transition: all 0.3s;
        }
        .step.active {
            opacity: 1;
            color: #fff;
        }
        .step.done {
            opacity: 1;
            color: var(--primary);
        }
        .step i {
            margin-left: 10px;
            font-style: normal;
            font-size: 1.2rem;
        }
        .hwid-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--primary);
            margin-top: 20px;
            display: none;
            word-break: break-all;
        }
        .warning {
            font-size: 0.8rem;
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div class="scanner-line" id="scanner"></div>
        <div class="icon-container" id="main-icon">🛡️</div>
        <div class="title">نظام الحماية المتقدم</div>

        <div class="step active" id="step1"><i>⏳</i> جاري قراءة بيانات النظام...</div>
        <div class="step" id="step2"><i>⏳</i> فحص المعالج الرسومي (WebGL)...</div>
        <div class="step" id="step3"><i>⏳</i> توليد البصمة الرقمية...</div>

        <div class="hwid-box" id="hwid-display"></div>
        <div class="warning" id="error-msg">يجب فتح هذا الرابط من داخل تليجرام فقط!</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 1. دالة استخراج بصمة كارت الشاشة (الأقوى على الإطلاق)
        function getWebGLFingerprint() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                let vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                let renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                return vendor + "~" + renderer;
            } catch (e) {
                return "WebGL-Not-Supported";
            }
        }

        // 2. دالة البصمة الرسومية
        function getCanvasFingerprint() {
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText("CyberShield_V2", 2, 15);
            return canvas.toDataURL();
        }

        // 3. الدالة الرئيسية لجمع البصمة
        function generateHardwareID() {
            let nav = window.navigator;
            let screen = window.screen;
            
            let components = [
                nav.userAgent,
                nav.hardwareConcurrency || 'unknown', // عدد الأنوية
                nav.deviceMemory || 'unknown',        // الرام
                nav.maxTouchPoints || 0,              // نقاط اللمس (لمعرفة إن كان محاكي)
                screen.width + 'x' + screen.height,   // أبعاد الشاشة
                new Date().getTimezoneOffset(),       // المنطقة الزمنية
                getWebGLFingerprint(),                // بصمة كارت الشاشة
                getCanvasFingerprint()                // بصمة الكانفاس
            ];

            let str = components.join('||');
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                let char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return "HW-" + Math.abs(hash).toString(36).toUpperCase();
        }

        // 4. تسلسل ظهور واجهة المستخدم لتبدو وكأنها عملية فحص حقيقية
        function startScan() {
            // التأكد أن التطبيق مفتوح داخل تليجرام
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                document.getElementById('scanner').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                return;
            }

            setTimeout(() => {
                document.getElementById('step1').classList.replace('active', 'done');
                document.getElementById('step1').innerHTML = '<i>✅</i> تمت قراءة بيانات النظام';
                document.getElementById('step2').classList.add('active');
            }, 800);

            setTimeout(() => {
                document.getElementById('step2').classList.replace('active', 'done');
                document.getElementById('step2').innerHTML = '<i>✅</i> تم فحص المعالج الرسومي';
                document.getElementById('step3').classList.add('active');
            }, 1800);

            setTimeout(() => {
                let deviceId = generateHardwareID();
                let isFirstTime = !localStorage.getItem("cyber_hwid_v2");
                
                if (isFirstTime) {
                    localStorage.setItem("cyber_hwid_v2", deviceId);
                }

                document.getElementById('step3').classList.replace('active', 'done');
                document.getElementById('step3').innerHTML = '<i>✅</i> تم التوثيق بنجاح';
                
                document.getElementById('scanner').style.display = 'none';
                document.getElementById('main-icon').innerText = '✅';
                
                let hwidBox = document.getElementById('hwid-display');
                hwidBox.innerText = deviceId;
                hwidBox.style.display = 'block';

                // تشغيل اهتزاز الهاتف عند النجاح
                if(tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                // تجهيز زر تليجرام للإرسال
                let actionType = window.location.search.includes("link") ? "link" : "verify";
                let payload = JSON.stringify({ 
                    device_id: deviceId, 
                    action: actionType,
                    is_new: isFirstTime
                });

                tg.MainButton.setText("تأكيد وحفظ البصمة");
                tg.MainButton.color = "#00ffcc";
                tg.MainButton.textColor = "#0a0a0f";
                tg.MainButton.show();
                
                tg.MainButton.onClick(() => {
                    if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    tg.sendData(payload);
                });

            }, 2800);
        }

        // بدء الفحص عند تحميل الصفحة
        window.onload = startScan;
    </script>
</body>
</html>
