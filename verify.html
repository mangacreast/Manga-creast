<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحقق الأمان - Manga Crest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --manga-primary: #9d4edd;
            --manga-secondary: #ff007f;
            --manga-accent: #00f5d4;
            --bg-dark: #0b090a;
            --card-bg: rgba(22, 26, 29, 0.85);
            --danger: #ef233c;
            --success: #2dc653;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            /* خلفية بنمط نقطي (Halftone) لتعطي طابع المانجا/الكوميكس */
            background-image: radial-gradient(rgba(157, 78, 221, 0.15) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* تأثير إضاءة خلفية */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--manga-primary) 0%, transparent 70%);
            opacity: 0.2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(50px);
            animation: pulseBg 4s infinite alternate;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(157, 78, 221, 0.3);
            border-radius: 24px;
            padding: 40px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(157, 78, 221, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* تأثير حدود المانجا */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--manga-secondary), var(--manga-primary), var(--manga-accent));
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--manga-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo span { color: var(--manga-primary); -webkit-text-fill-color: var(--manga-primary); }

        /* رادار الفحص */
        .scanner-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 2px solid rgba(0, 245, 212, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-radar {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent 70%, var(--manga-accent) 100%);
            border-radius: 50%;
            animation: scanRotate 2s linear infinite;
        }

        .scanner-icon {
            font-size: 40px;
            z-index: 2;
            text-shadow: 0 0 10px var(--manga-accent);
        }

        .title-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        .sub-text { font-size: 0.9rem; color: #adb5bd; margin-bottom: 25px; line-height: 1.5; }

        .hwid-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--manga-accent);
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 1rem;
            color: var(--manga-accent);
            letter-spacing: 1px;
            word-break: break-all;
            margin-bottom: 20px;
            position: relative;
        }

        .btn-custom {
            background: linear-gradient(45deg, var(--manga-primary), var(--manga-secondary));
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(157, 78, 221, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-custom:active { transform: scale(0.95); }

        /* حالات الشاشات (للتبديل بينها عبر الجافاسكربت) */
        #screen-success, #screen-error { display: none; }

        /* تصميم شاشة الخطأ */
        .error-theme .container::before { background: var(--danger); }
        .error-theme .scanner-container { border-color: rgba(239, 35, 60, 0.3); }
        .error-theme .scanner-icon { text-shadow: 0 0 10px var(--danger); }
        .error-theme .hwid-box { border-color: var(--danger); color: var(--danger); }

        @keyframes scanRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseBg { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.2); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .animate-fade { animation: fadeIn 0.5s forwards; }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container" id="main-card">
        <div class="logo">Manga<span>Crest</span></div>

        <!-- شاشة 1: الفحص -->
        <div id="screen-loading" class="animate-fade">
            <div class="scanner-container">
                <div class="scanner-radar"></div>
                <div class="scanner-icon">🛡️</div>
            </div>
            <div class="title-text">جاري فحص الجهاز...</div>
            <div class="sub-text">نظام مكافحة تعدد الحسابات يعمل الآن، يرجى الانتظار للحظات.</div>
        </div>

        <!-- شاشة 2: النجاح -->
        <div id="screen-success" class="animate-fade">
            <div class="scanner-container" style="border-color: var(--success)">
                <div class="scanner-icon" style="text-shadow: 0 0 10px var(--success)">✅</div>
            </div>
            <div class="title-text" style="color: var(--success)">تم التحقق بنجاح!</div>
            <div class="sub-text">هوية جهازك مطابقة وآمنة. يمكنك الآن متابعة القراءة.</div>
            
            <div class="hwid-box" id="hwid-display"></div>
            
            <!-- زر بديل داخل الويب يظهر كخيار سريع -->
            <button class="btn-custom" onclick="submitToBot()">الدخول إلى البوت 🚀</button>
        </div>

        <!-- شاشة 3: الخطأ (تعدد الحسابات) -->
        <div id="screen-error" class="animate-fade">
            <div class="scanner-container" style="border-color: var(--danger)">
                <div class="scanner-icon" style="text-shadow: 0 0 10px var(--danger)">⚠️</div>
            </div>
            <div class="title-text" style="color: var(--danger)">تم حظر الدخول!</div>
            <div class="sub-text">تم اكتشاف محاولة دخول من حساب تليجرام آخر على نفس هذا الجهاز. <b>(يُمنع تعدد الحسابات)</b>.</div>
            <div class="hwid-box" id="hwid-error" style="border-color: var(--danger); color: var(--danger)"></div>
        </div>
    </div>

    <script>
        // إعداد تليجرام
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        // إخفاء زر الرجوع لو كان ظاهراً
        if(tg.BackButton) tg.BackButton.hide();
        
        let generatedFingerprint = "";
        const BOT_USERNAME = "YOUR_BOT_USERNAME"; // ⚠️ ضع معرف بوتك هنا بدون @

        // دالة إنشاء بصمة معقدة وقوية
        function getAdvancedFingerprint() {
            let canvas = document.createElement('canvas');
            let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            let renderer = "Unknown";
            if (gl) {
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            }
            
            let nav = window.navigator;
            let screen = window.screen;
            
            // تجميع بيانات دقيقة عن الجهاز
            let components = [
                nav.userAgent,
                nav.hardwareConcurrency || 1,
                nav.deviceMemory || 1,
                nav.maxTouchPoints || 0,
                screen.width + 'x' + screen.height,
                screen.colorDepth,
                new Date().getTimezoneOffset(),
                renderer,
                nav.language
            ];
            
            let str = components.join('||');
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            // توليد كود نظيف وقصير بصيغة MC-XXXX-XXXX
            let hex = Math.abs(hash).toString(16).toUpperCase();
            return `MC-${hex.substring(0,4)}-${hex.substring(4,8) || 'A1B2'}`;
        }

        // تبديل الشاشات
        function switchScreen(screenId, isError = false) {
            document.getElementById('screen-loading').style.display = 'none';
            document.getElementById('screen-success').style.display = 'none';
            document.getElementById('screen-error').style.display = 'none';
            
            document.getElementById(screenId).style.display = 'block';
            
            if(isError) {
                document.body.classList.add('error-theme');
            }
        }

        // محاكاة وقت التحميل للفحص (يضيف واقعية للتطبيق)
        setTimeout(() => {
            generatedFingerprint = getAdvancedFingerprint();
            let currentUserId = tg.initDataUnsafe?.user?.id || "DevTest_" + Math.floor(Math.random()*1000);
            
            let savedData = localStorage.getItem("manga_crest_sec_v2");
            let isMultiAccount = false;

            if (savedData) {
                let parts = savedData.split(':');
                let savedUserId = parts[1];
                // إذا كان الجهاز مسجلاً بحساب آخر
                if (savedUserId !== currentUserId.toString()) {
                    isMultiAccount = true; 
                }
            }

            if (isMultiAccount) {
                // حالة الخطأ
                switchScreen('screen-error', true);
                document.getElementById('hwid-error').innerText = "ID: " + generatedFingerprint;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.MainButton.hide();
            } else {
                // حالة النجاح
                localStorage.setItem("manga_crest_sec_v2", generatedFingerprint + ":" + currentUserId);
                
                switchScreen('screen-success', false);
                document.getElementById('hwid-display').innerText = generatedFingerprint;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                // إعداد زر تليجرام الرئيسي (تحت الشاشة)
                tg.MainButton.setText("تأكيد الدخول");
                tg.MainButton.color = "#9d4edd";
                tg.MainButton.textColor = "#ffffff";
                tg.MainButton.show();
                
                tg.MainButton.onClick(() => {
                    submitToBot();
                });
            }
        }, 2500); // 2.5 ثانية مدة انيميشن الفحص الوهمي

        // دالة الإرسال للبوت
        function submitToBot() {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
            
            // محاولة إرسال البيانات (تنجح فقط إذا فتح من كيبورد عادي)
            try {
                tg.sendData("VERIFY:" + generatedFingerprint);
            } catch(e) {
                console.log("sendData failed, using fallback.");
            }

            // الخطة البديلة المضمونة (رابط Deep link) تعمل دائماً وتغلق التطبيق
            setTimeout(() => {
                tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=v_${generatedFingerprint}`);
                tg.close();
            }, 300);
        }
    </script>
</body>
</html>
