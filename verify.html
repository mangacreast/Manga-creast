<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberShield Security</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #00ffcc; --danger: #ff3366; --bg-color: #0a0a0f; --card-bg: rgba(20, 20, 30, 0.7); }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg-color) 70%);
            color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden;
        }
        .container {
            background: var(--card-bg); border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 20px; padding: 30px; width: 85%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            position: relative; overflow: hidden; text-align: center;
        }
        .scanner-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary); box-shadow: 0 0 15px var(--primary);
            animation: scan 2s infinite ease-in-out; display: block;
        }
        @keyframes scan { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
        .icon-container { font-size: 50px; margin-bottom: 15px; text-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
        .title { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-bottom: 25px; }
        .step { display: flex; align-items: center; margin-bottom: 15px; font-size: 0.9rem; color: #aaa; opacity: 0.4; transition: all 0.3s; }
        .step.active { opacity: 1; color: #fff; }
        .step.done { opacity: 1; color: var(--primary); }
        .step.error { opacity: 1; color: var(--danger); font-weight: bold; }
        .step i { margin-left: 10px; font-style: normal; font-size: 1.2rem; }
        .hwid-box {
            background: rgba(0, 0, 0, 0.5); border: 1px dashed var(--primary);
            padding: 15px; border-radius: 10px; font-family: monospace; font-size: 1.1rem; color: var(--primary);
            margin-top: 20px; display: none; word-break: break-all;
        }
        .hwid-box.danger-box { border-color: var(--danger); color: var(--danger); }
        .btn-fallback {
            background: var(--primary); color: #000; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: bold; margin-top: 20px; width: 100%; cursor: pointer; display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div class="scanner-line" id="scanner"></div>
        <div class="icon-container" id="main-icon">🛡️</div>
        <div class="title" id="main-title">نظام الحماية المتقدم</div>

        <div class="step active" id="step1"><i>⏳</i> جاري قراءة بيانات النظام...</div>
        <div class="step" id="step2"><i>⏳</i> فحص محاولات التعدد...</div>
        <div class="step" id="step3"><i>⏳</i> توليد البصمة الرقمية...</div>

        <div class="hwid-box" id="hwid-display"></div>
        
        <!-- زر يظهر فقط في حال فشل زر تليجرام بسبب الزر الشفاف -->
        <button class="btn-fallback" id="fallback-btn" onclick="sendViaLink()">العودة للبوت والتأكيد</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let generatedDeviceId = "";

        // دالة استخراج بصمة كارت الشاشة
        function getWebGLFingerprint() {
            try {
                let canvas = document.createElement('canvas');
                let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                let debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) + "~" + gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            } catch (e) { return "WebGL-Not-Supported"; }
        }

        function generateHardwareID() {
            let nav = window.navigator;
            let screen = window.screen;
            let components = [
                nav.hardwareConcurrency || 'unknown',
                nav.deviceMemory || 'unknown',
                nav.maxTouchPoints || 0,
                screen.width + 'x' + screen.height,
                new Date().getTimezoneOffset(),
                getWebGLFingerprint()
            ];
            let str = components.join('||');
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return "HW-" + Math.abs(hash).toString(36).toUpperCase();
        }

        function startScan() {
            setTimeout(() => {
                document.getElementById('step1').classList.replace('active', 'done');
                document.getElementById('step1').innerHTML = '<i>✅</i> تمت قراءة بيانات النظام';
                document.getElementById('step2').classList.add('active');
            }, 800);

            setTimeout(() => {
                // توليد البصمة الحالية
                generatedDeviceId = generateHardwareID();
                let currentUserId = tg.initDataUnsafe?.user?.id || "UnknownUser";
                
                // جلب البيانات المحفوظة سابقاً
                let savedData = localStorage.getItem("cyber_security_data");
                let isMultiAccount = false;
                let isFirstTime = true;

                if (savedData) {
                    isFirstTime = false;
                    let parts = savedData.split('|');
                    let savedDeviceId = parts[0];
                    let savedUserId = parts[1];

                    // لو الأيدي المحفوظ لا يساوي أيدي الشخص الحالي (معناه فتح حسابين من نفس الجهاز)
                    if (savedUserId !== currentUserId.toString()) {
                        isMultiAccount = true;
                    }
                }

                // --- حالة الرفض: محاولة فتح حساب ثاني ---
                if (isMultiAccount) {
                    document.getElementById('scanner').style.display = 'none';
                    document.getElementById('main-icon').innerText = '🚫';
                    document.getElementById('main-title').innerText = 'تم حظر العملية';
                    document.getElementById('main-title').style.color = 'var(--danger)';
                    
                    document.getElementById('step2').classList.replace('active', 'error');
                    document.getElementById('step2').innerHTML = '<i>❌</i> تم اكتشاف تعدد حسابات!';
                    
                    document.getElementById('step3').classList.add('error');
                    document.getElementById('step3').innerHTML = '<i>❌</i> لا يمكنك تسجيل حساب جديد من هذا الجهاز.';
                    
                    let hwidBox = document.getElementById('hwid-display');
                    hwidBox.innerText = "جهاز مقيد بسبب التعدد";
                    hwidBox.className = "hwid-box danger-box";
                    hwidBox.style.display = 'block';

                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    return; // إيقاف التنفيذ وعدم إظهار زر الحفظ
                }

                // --- حالة القبول ---
                // حفظ البيانات الجديدة
                if (isFirstTime) {
                    localStorage.setItem("cyber_security_data", generatedDeviceId + "|" + currentUserId);
                }

                document.getElementById('step2').classList.replace('active', 'done');
                document.getElementById('step2').innerHTML = '<i>✅</i> الجهاز سليم (لا يوجد تعدد)';
                document.getElementById('step3').classList.add('active');

                setTimeout(() => {
                    document.getElementById('step3').classList.replace('active', 'done');
                    document.getElementById('step3').innerHTML = '<i>✅</i> تم التوثيق بنجاح';
                    
                    document.getElementById('scanner').style.display = 'none';
                    document.getElementById('main-icon').innerText = '✅';
                    
                    let hwidBox = document.getElementById('hwid-display');
                    hwidBox.innerText = generatedDeviceId;
                    hwidBox.style.display = 'block';

                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                    // تجهيز زر تليجرام
                    let payload = JSON.stringify({ 
                        device_id: generatedDeviceId, 
                        is_new: isFirstTime
                    });

                    tg.MainButton.setText(isFirstTime ? "تأكيد وحفظ البصمة" : "تسجيل الدخول");
                    tg.MainButton.color = "#00ffcc";
                    tg.MainButton.textColor = "#0a0a0f";
                    tg.MainButton.show();
                    
                    tg.MainButton.onClick(() => {
                        if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                        tg.sendData(payload); // هذا يعمل مع أزرار الكيبورد السفلية فقط

                        // إذا لم يتم الإغلاق خلال نصف ثانية (بسبب استخدام زر شفاف) نظهر الزر البديل
                        setTimeout(() => {
                            tg.MainButton.hide();
                            document.getElementById('fallback-btn').style.display = 'block';
                            document.getElementById('main-title').innerText = 'يرجى الضغط على الزر بالأسفل';
                            document.getElementById('main-title').style.fontSize = '1rem';
                        }, 500);
                    });

                }, 1000);
            }, 1800);
        }

        // دالة الزر البديل (في حال كان البوت يستخدم أزرار شفافة)
        // يجب استبدال YOUR_BOT_USERNAME بمعرف البوت الخاص بك بدون @
        function sendViaLink() {
            let botUsername = "blockspam_akbot"; // ⚠️ ضع معرف البوت هنا
            let payloadText = "verify_" + generatedDeviceId;
            tg.openTelegramLink("https://t.me/" + botUsername + "?start=" + payloadText);
            tg.close();
        }

        window.onload = startScan;
    </script>
</body>
</html>
